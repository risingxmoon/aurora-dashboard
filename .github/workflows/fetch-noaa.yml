name: Fetch NOAA Space Weather Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch space weather data
        run: |
          mkdir -p data

          # Bz・Bt（磁場）
          curl -sf "https://services.swpc.noaa.gov/products/solar-wind/mag-2-hour.json" \
            -o data/mag.json || echo "[]" > data/mag.json

          # 太陽風速度・密度
          curl -sf "https://services.swpc.noaa.gov/products/solar-wind/plasma-2-hour.json" \
            -o data/plasma.json || echo "[]" > data/plasma.json

          # Kp指数
          curl -sf "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json" \
            -o data/kp.json || echo "[]" > data/kp.json

          # EPAM（高エネルギー粒子）
          curl -sf "https://services.swpc.noaa.gov/json/ace/epam/ace_epam_5m.json" \
            -o data/epam.json || echo "[]" > data/epam.json

          # HP（半球電力）
          curl -sf "https://services.swpc.noaa.gov/json/ovation_aurora_latest.json" \
            -o data/ovation.json || echo "{}" > data/ovation.json

          # 更新時刻を記録
          echo "{\"updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/meta.json

          echo "=== Data fetched at $(date -u) ==="
          ls -lh data/

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update space weather data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
