name: Fetch NOAA Space Weather Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch space weather data
        run: |
          mkdir -p data

          # Kp指数
          curl -sf "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json" \
            -o data/kp.json || echo "[]" > data/kp.json

          # EPAM（高エネルギー粒子）
          curl -sf "https://services.swpc.noaa.gov/json/ace/epam/ace_epam_5m.json" \
            -o data/epam.json || echo "[]" > data/epam.json

          # mag・plasma を 7-day に変更（6時間分グラフ用）
          curl -sf "https://services.swpc.noaa.gov/products/solar-wind/mag-7-day.json" \
            -o data/mag.json || echo "[]" > data/mag.json
          curl -sf "https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json" \
            -o data/plasma.json || echo "[]" > data/plasma.json

          # HP（半球電力）履歴をJSONで保存（過去6時間=72点）
          HP_TXT=$(curl -sf "https://services.swpc.noaa.gov/text/aurora-nowcast-hemi-power.txt" || echo "")
          if [ -n "$HP_TXT" ]; then
            LAST_LINE=$(echo "$HP_TXT" | grep -v '^#' | grep -v '^$' | tail -1)
            NORTH=$(echo "$LAST_LINE" | awk '{print $3}')
            SOUTH=$(echo "$LAST_LINE" | awk '{print $4}')
            OBS=$(echo "$LAST_LINE" | awk '{print $1}')
            # 過去72行（6時間分）を配列化
            HISTORY=$(echo "$HP_TXT" | grep -v '^#' | grep -v '^$' | tail -72 | awk '{printf "{\"time\":\"%s\",\"north\":%s,\"south\":%s}", $1, $3, $4}' | paste -sd ',' | sed 's/^/[/' | sed 's/$/]/')
            echo "{\"north\":${NORTH:-0},\"south\":${SOUTH:-0},\"observed\":\"${OBS}\",\"history\":${HISTORY:-[]}}" > data/hp.json
          else
            echo "{\"north\":null,\"south\":null,\"history\":[]}" > data/hp.json
          fi

          # 更新時刻を記録
          echo "{\"updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/meta.json

          echo "=== Data fetched at $(date -u) ==="
          ls -lh data/

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update space weather data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
